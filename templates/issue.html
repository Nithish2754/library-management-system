<!DOCTYPE html>
<html>
<head>
    <title>Issue Book</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h2>Issue Book</h2>
    <form method="POST" action="/issue">
        <label>Select Book (ISBN):</label>
        <select name="isbn" required>
            {% for b in books %}
              <option value="{{ b.isbn }}">{{ b.title }} — {{ b.isbn }} ({{ b.copies }} copies)</option>
            {% endfor %}
        </select><br>

        <label>Select Member:</label>
        <select name="member_id" required>
            {% for m in members %}
              <option value="{{ m.member_id }}">{{ m.name }} — {{ m.member_id }}</option>
            {% endfor %}
        </select><br>

        <button type="submit">Issue</button>
    </form>
    <br>
    <a href="/">Go Back to Home</a>
</body>
</html>
